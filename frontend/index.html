<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kronos</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="icons/icon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#EE4D2D">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<script>
(function(){
  try{
    var saved = localStorage.getItem('kronoop-theme');
    var theme = saved || ((window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light');
    document.documentElement.setAttribute('data-theme', theme);
  }catch(e){}
})();
</script>
</head>
<body>
<div id="view-boot">
  <div class="boot-brand">
    <svg class="boot-mark" viewBox="0 0 100 100" aria-hidden="true">
      <rect width="100" height="100" rx="22" class="brand-mark-bg"/>
      <rect x="33" y="23" width="11" height="54" rx="5.5" class="brand-mark-fg"/>
      <line x1="41" y1="50" x2="72" y2="25" stroke-width="11" stroke-linecap="round" class="brand-mark-fg"/>
      <line x1="41" y1="50" x2="72" y2="75" stroke-width="11" stroke-linecap="round" class="brand-mark-fg"/>
      <circle cx="42" cy="50" r="7.5" class="brand-mark-bg"/>
    </svg>
    <div class="boot-logo">Kronos</div>
  </div>
</div>
<div id="view-login">
  <div class="login-globe" aria-hidden="true"></div>
  <div class="glow-orb orb-1"></div>
  <div class="glow-orb orb-2"></div>
  <div class="login-88-watermark" aria-hidden="true">8.8</div>
  <div class="login-card">
    <div class="login-88-badge">🔥 KRONOS 8.8 · OPS DAY</div>
    <div class="login-eyebrow">Kronos · Ops Control</div>
    <div class="title-row">
      <div class="title-brand">
        <svg class="login-mark" viewBox="0 0 100 100" aria-hidden="true">
          <rect width="100" height="100" rx="22" class="brand-mark-bg"/>
          <rect x="33" y="23" width="11" height="54" rx="5.5" class="brand-mark-fg"/>
          <line x1="41" y1="50" x2="72" y2="25" stroke-width="11" stroke-linecap="round" class="brand-mark-fg"/>
          <line x1="41" y1="50" x2="72" y2="75" stroke-width="11" stroke-linecap="round" class="brand-mark-fg"/>
          <circle cx="42" cy="50" r="7.5" class="brand-mark-bg"/>
        </svg>
        <h1 class="login-title display">Kronos</h1>
      </div>
      <label class="theme-switch" title="Alternar tema">
        <input type="checkbox" class="theme-switch-input" aria-label="Alternar tema">
        <span class="theme-switch-track"><span class="theme-switch-thumb">🌙</span></span>
      </label>
    </div>
    <p class="login-sub">Entre com seu e-mail e senha cadastrados.</p>

    <div id="loginErrorReal" class="login-error"></div>
    <div class="field">
      <label>E-mail</label>
      <input type="email" id="loginEmail" placeholder="Digite seu e-mail" autocomplete="username">
    </div>
    <div class="field">
      <label>Senha</label>
      <input type="password" id="loginPassReal" placeholder="••••••••" autocomplete="current-password">
    </div>
    <div class="login-options-row">
      <label class="login-remember"><input type="checkbox" id="loginRemember"> Lembrar meu e-mail</label>
      <a href="javascript:void(0)" id="loginForgotLink">Esqueci minha senha</a>
    </div>
    <button class="btn-primary" id="loginBtnReal">Entrar</button>
  </div>
</div>

<div id="view-app">
  <div class="shell">
    <div class="sidebar">
      <div class="brand-row">
        <button class="sidebar-toggle" id="btnSidebarToggle" title="Recolher menu" aria-label="Recolher/expandir menu">☰</button>
        <div class="brand-dot"></div>
        <div class="brand-name">Kronos</div>
        <button class="notif-bell-btn" id="btnNotificacoes" title="Notificações" aria-label="Notificações" style="display:none;margin-left:auto;">
          🔔<span class="notif-badge" id="notifBadgeCount"></span>
        </button>
        <label class="theme-switch" title="Alternar tema">
          <input type="checkbox" class="theme-switch-input" aria-label="Alternar tema">
          <span class="theme-switch-track"><span class="theme-switch-thumb">🌙</span></span>
        </label>
      </div>
      <div id="navEyebrow" class="nav-eyebrow">Menu</div>
      <div id="navItems"></div>
      <button class="menu-config-btn" id="btnPersonalizarMenu"><span class="mcb-icon"><i data-lucide="settings" class="ico"></i></span><span class="mcb-label">Personalizar menu</span></button>
      <div class="sidebar-foot">
        <div class="user-chip">
          <div class="user-name" id="chipName">—</div>
          <div class="user-role" id="chipRole">—</div>
          <div class="user-sup" id="chipSup"></div>
        </div>
        <button class="logout-btn" id="logoutBtn" title="Sair"><span class="logout-icon"><i data-lucide="log-out" class="ico"></i></span><span class="logout-label">Sair</span></button>
      </div>
    </div>
    <div class="nav-mobile-backdrop" id="navMobileBackdrop"></div>
    <div class="main" id="mainArea"></div>
  </div>
</div>

<div class="modal-bg" id="modalBg">
  <div class="modal" id="modalBody"></div>
</div>


<script src="https://unpkg.com/lucide@1.31.0/dist/umd/lucide.js"></script>
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/supabase-init.js"></script>
<script src="js/utils.js"></script>
<script src="js/state.js"></script>
<script src="js/ui.js"></script>
<script src="js/render-analista.js"></script>
<script src="js/render-supervisor.js"></script>
<script src="js/render-coordenador.js"></script>
<script src="js/events.js"></script>
<script src="js/main.js"></script>
</body>
</html>
