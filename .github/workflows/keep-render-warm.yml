name: Keep Render backend warm

# O plano gratuito do Render "dorme" o serviço após ~15 min sem receber
# requisição — o primeiro acesso depois disso demora 30-50s pra responder
# (o container precisa subir de novo). Um ping a cada 10 min mantém o
# serviço sempre acordado, sem custo (Actions em repositório público é
# gratuito) e sem precisar de infraestrutura externa.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /api/health
        run: curl -sf --max-time 60 https://kronoopoficial.onrender.com/api/health
